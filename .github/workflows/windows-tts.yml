name: Windows TTS launcher
on:
  pull_request:
    paths:
      - 'autorun.py'
      - 'hub/servers.py'
      - 'tts/**'
      - 'tests/test_tts_control.py'
      - '.github/workflows/windows-tts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_tts_control.py -v
